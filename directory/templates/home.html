{% load static %}
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maheshwari Samaj Vidisha</title>
    <style>

   * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        /* Screen ko fix karne ke liye height aur width 100% */
        height: 100%;
        width: 100%;
        overflow: hidden; /* Scrolling band kar di taaki div hile na */
    }

    body {
        /* Background Image Setting: Jo hamesha fit rahegi */
        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                    url("{% static 'bg.png' %}") no-repeat;
        
        /* Yeh line image ko hamesha poori screen par fit rakhegi */
        background-size: 100% 100%; 
        background-position: center;

        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    .card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        
        padding: 15px 25px 25px 25px;
        border-radius: 25px;
        text-align: center;
        border: 1px solid rgba(255, 215, 0, 0.4);
        
        /* Dabba size consistency */
        width: 380px;
        max-width: 90%;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        color: white;

        margin-top:30px;
        margin-bottom:70px; 
    }

    .logo {
        width: 65px;
        margin-bottom: 10px;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 25px;
        color: #FFD700;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    input {
        width: 100%;
        padding: 12px;
        border-radius: 30px;
        border: none;
        margin-bottom: 20px;
        text-align: center;
        font-size: 16px;
        background: white;
        color: black;
        outline: none;
    }

    .btn {
        width: 100%;
        background: linear-gradient(45deg, #bf953f, #fcf6ba, #bf953f);
        color: #4a3300;
        padding: 12px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-weight: bold;
        font-size: 18px;
    }
</style>
    </style>
</head>
<body>
    <div class="card">
        {% load static %}
        <img src="{% static 'logo.jpg' %}" class="logo" alt="Logo">
        
        <h1>"जय श्री कृष्ण"</h1>
        
        <form method="POST" action="{% url 'home' %}">
            {% csrf_token %}
            <input type="tel" 
                   name="phone_number" 
                   placeholder="Enter your phone number" 
                   maxlength="10" 
                   pattern="\d{10}" 
                   oninput="this.value=this.value.replace(/[^0-9]/g,'');" 
                   required>
              <br>

            <button type="submit" class="btn">Next</button>
            <div style="margin-top: 20px; text-align: center; border-top: 1px solid #eee; padding-top: 15px;">
    <a href="/directory-list/" style="display: block; width: 100%; padding: 12px; border: 2px solid #bf953f; color: #bf953f; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 14px; box-sizing: border-box; transition: 0.3s;">
        🔍 View All Families
    </a>
    </div>
        </form>
        {% if msg %}
        <p style="color: #FFD700; margin-top: 15px; font-weight: bold;">{{ msg }}</p>
    {% endif %}

    </div>
</body>
</html>
